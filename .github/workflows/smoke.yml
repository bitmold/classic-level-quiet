name: Smoke
on: workflow_dispatch
concurrency:
  group: smoke
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        # Same as release.yml
        include:
          - os: ubuntu-latest
            arch: x64
            build-group: android-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.build-group }}
    env:
      BUILD_GROUP: ${{ matrix.build-group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up node
        uses: actions/setup-node@v3
        with:
          node-version: 14
          architecture: ${{ matrix.arch }}
      - name: Install
        run: npm install --ignore-scripts
      - name: Prebuild
        run: npm run prebuild-$BUILD_GROUP
        shell: bash
      - name: Prepare artifact
        run: tar -zcvf $BUILD_GROUP.tar.gz -C prebuilds .
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BUILD_GROUP }}
          path: ${{ env.BUILD_GROUP }}.tar.gz
          retention-days: 1
